# Construye una imagen de OpenPost cuyo frontend incluye el catálogo español
# completo Y la marca «Gestión de RRSS», y la publica en GitHub Container Registry.
#
# ── Por qué existe este fichero ──────────────────────────────────────────────
#
# El CI del proyecto (`.github/workflows/ci.yml`) NO puede publicar la imagen
# hoy: construye las referencias con `${{ github.repository }}`, que conserva
# las mayúsculas del nombre (`Digital-Media-Group`), y un registro OCI no admite
# mayúsculas en el nombre del repositorio. El build termina bien y falla después,
# al escanear: «could not parse reference: ghcr.io/Digital-Media-Group/…».
#
# Este workflow esquiva ese fallo porque escribe el nombre del paquete en
# minúsculas a mano, sin depender de ninguna variable que conserve mayúsculas.
# No toca el CI del proyecto ni el Dockerfile: usa los mismos.
#
# ── Por qué el Dockerfile no se puede construir con un `docker build` normal ──
#
# Su primera etapa es `FROM frontend_artifact`: un contexto con nombre de
# BuildKit que debe aportar quien invoca la construcción. Por eso aquí el
# frontend se compila antes, en su propio paso, y se entrega con
# `build-contexts`.
name: Construir imagen con español y marca

on:
  # 1) Automático: cada vez que cambia `main` de este fork se reconstruye y se
  #    republica la imagen. Así el fork no depende de que alguien pulse un botón
  #    ni de ningún permiso extra más allá de poder subir el fichero.
  push:
    branches: [main]
  # 2) A mano, desde la pestaña Actions → «Run workflow»: sirve para construir
  #    otra rama o etiqueta (por ejemplo `es-corregido`) sin tocar `main`.
  workflow_dispatch:
    inputs:
      ref:
        description: "Rama o etiqueta a construir"
        required: false
        default: main
        type: string

permissions:
  contents: read
  packages: write

env:
  BUN_VERSION: "1.3.11" # coincide con `packageManager` en package.json
  NODE_VERSION: "24.19.0"
  # Minúsculas escritas a mano: es justamente lo que el CI del proyecto no hace.
  IMAGE: ghcr.io/digital-media-group/openpost

jobs:
  build:
    name: Construir y publicar
    runs-on: ubuntu-latest
    steps:
      # `main` de este fork = español completo + marca + los dos arreglos de
      # maquetación. La entrada `ref` permite construir otra rama sin editar
      # el fichero.
      - name: Traer el código
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'main' }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cachear dependencias
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Instalar dependencias
        run: bun install --frozen-lockfile

      # La comprobación de i18n del propio proyecto: paridad de claves,
      # marcadores, cadenas vacías. Una imagen no sale de aquí si falla.
      - name: Verificar los catálogos de traducción
        run: node scripts/check-i18n.mjs

      # check-i18n.mjs sólo exige paridad de claves: un catálogo puede pasarlo
      # teniendo texto en inglés. Esto comprueba que las cadenas que este fork
      # existe para arreglar siguen realmente traducidas, tanto la del
      # portapapeles (la que motivó todo) como el aviso de versión modificada
      # que exige la licencia AGPL.
      - name: Comprobar que el español y el aviso AGPL siguen ahí
        run: |
          set -euo pipefail
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const catalogue = JSON.parse(
              readFileSync("apps/web/messages/es.json", "utf8"),
            );
            const mustBeSpanish = [
              ["settings_token_copy_failed", /the token could not be copied/i],
              ["sidebar_source_link", /OpenPost Contributors/i],
            ];
            for (const [key, english] of mustBeSpanish) {
              const value = catalogue[key];
              if (typeof value !== "string" || value.trim() === "") {
                console.error(`::error::${key} falta o está vacía en es.json`);
                process.exit(1);
              }
              if (english.test(value)) {
                console.error(`::error::${key} sigue en inglés: ${value}`);
                process.exit(1);
              }
              console.log(`ok  ${key}: ${value.slice(0, 70)}`);
            }
          '

      - name: Construir el frontend
        run: bun run build -- frontend

      # El contrato de empaquetado del propio proyecto: el artefacto debe
      # llevar ambos ficheros, para que un build incompleto no llegue a imagen.
      - name: Comprobar que el artefacto está completo
        run: |
          set -euo pipefail
          public=apps/server/cmd/openpost/public
          test -f "$public/index.html" || { echo "::error::falta index.html"; exit 1; }
          test -f "$public/app-routes.json" || { echo "::error::falta app-routes.json"; exit 1; }
          du -sh "$public"

      # Huella del español dentro del paquete ya construido.
      #
      # «No se pudo acceder al portapapeles» es justo el mensaje que este fork
      # traduce y que upstream todavía sirve en inglés. Aparece en un único
      # catálogo (es.json) y en ningún otro sitio del repositorio, así que
      # encontrarlo en la salida demuestra que ESTE catálogo se compiló dentro.
      # La aguja es ASCII puro a propósito: así la minificación ni el escapado
      # Unicode pueden romper la comprobación.
      - name: Comprobar que el español va incrustado
        run: |
          set -euo pipefail
          public=apps/server/cmd/openpost/public
          needle="No se pudo acceder al portapapeles"
          if grep -rqF "$needle" "$public"; then
            echo "Catálogo español confirmado dentro del build."
          else
            echo "::error::El catálogo español NO está en la salida del build."
            exit 1
          fi

      # La marca: si alguien revierte el white-label, esto lo detecta antes de
      # publicar, en lugar de descubrirlo en la interfaz.
      - name: Comprobar que la marca va incrustada
        run: |
          set -euo pipefail
          public=apps/server/cmd/openpost/public
          if grep -rqF "Gestión de RRSS" "$public"; then
            echo "Marca «Gestión de RRSS» confirmada dentro del build."
          else
            echo "::error::La marca NO está en la salida del build."
            exit 1
          fi

      # El frontend construido, como artefacto descargable. No hace falta para
      # publicar la imagen: está para poder inspeccionarlo si algo saliera mal,
      # sin rehacer un build de veinte minutos.
      - name: Guardar el frontend construido
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-es-dmg-${{ github.sha }}
          path: apps/server/cmd/openpost/public
          if-no-files-found: error
          retention-days: 14

      - uses: docker/setup-buildx-action@v3

      - name: Entrar en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          # Sólo amd64: es la arquitectura del servidor de destino, y así el
          # build dura la mitad.
          platforms: linux/amd64
          # Aporta el contexto con nombre que espera la primera etapa.
          build-contexts: |
            frontend_artifact=apps/server/cmd/openpost/public
          push: true
          tags: |
            ${{ env.IMAGE }}:es-dmg
            ${{ env.IMAGE }}:es-dmg-${{ github.run_number }}
          build-args: |
            VERSION=es-dmg-${{ github.run_number }}
            COMMIT=${{ github.sha }}

      - name: Resumen
        run: |
          {
            echo "### Imagen publicada"
            echo
            echo "- \`${{ env.IMAGE }}:es-dmg\`"
            echo "- \`${{ env.IMAGE }}:es-dmg-${{ github.run_number }}\`"
            echo "- Origen: \`${{ github.sha }}\`"
            echo
            echo "Para usar el número de ejecución concreto, fija la etiqueta"
            echo "en el compose en vez de \`:es-dmg\`."
          } >> "$GITHUB_STEP_SUMMARY"
